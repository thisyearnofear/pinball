<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta property="og:image" content="https://arbipinball.netlify.app/assets/sprites/logo.png" />
  <meta name="fc:miniapp" content='{
    "version": "1",
    "imageUrl": "https://arbipinball.netlify.app/assets/sprites/logo.png",
    "button": {
      "title": "Play Pinball!",
      "action": {
        "type": "launch_frame",
        "name": "ArbiPinball",
        "splashImageUrl": "https://arbipinball.netlify.app/assets/sprites/logo.png",
        "splashBackgroundColor": "#1b1922"
      }
    }
  }' />
  <link rel="icon" href="/favicon.ico">
  <title>ArbiPinball</title>
</head>

<body>
  <noscript>
    <strong>We're sorry but this app doesn't work properly without JavaScript enabled. Please enable it to
      continue.</strong>
  </noscript>
  <div id="app"></div>
  
  <!-- Import map for SparkJS dependencies -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- SparkJS for Gaussian Splat world rendering - loaded dynamically on demand -->
  <script>
    window.__sparkLoadPromise = null;
    window.__loadSpark = function() {
      if (window.Spark) return Promise.resolve(window.Spark);
      if (window.__sparkLoadPromise) return window.__sparkLoadPromise;
      
      window.__sparkLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.type = 'module';
        script.textContent = `
          import * as Spark from 'https://sparkjs.dev/releases/spark/2.0.0/spark.module.js';
          window.Spark = Spark;
          window.__sparkResolve?.();
        `;
        script.onerror = () => reject(new Error('Failed to load SparkJS'));
        document.head.appendChild(script);
      });
      
      return window.__sparkLoadPromise;
    };
  </script>
  
  <!-- Global shim for WalletConnect compatibility -->
  <script>
    if (typeof globalThis === 'undefined') {
      window.globalThis = window;
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

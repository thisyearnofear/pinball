name: visual-gate

# Renders the static export in a real browser and proves it is not a blank
# screen and that the Rive HUD state machine actually responds to game
# state (docs/TRAPS.md #1/#2/#9). checks.yml deliberately never builds;
# this is the render half of the gate.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace-and-screenshots
          path: |
            test-results/
            playwright-report/
          retention-days: 7
